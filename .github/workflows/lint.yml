name: Lint

on:
  push:
    branches:
      - master
    paths:
      - '**.php'
      - .github/workflows/lint.yml

  pull_request:
    paths:
      - '**.php'
      - .github/workflows/lint.yml

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          tools: pint

      - name: Run Pint
        run: pint --test
