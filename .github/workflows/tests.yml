name: Tests

on:
  push:
    branches:
      - master
    paths:
      - '**.php'
      - phpunit.xml.dist
      - composer.json
      - .github/workflows/tests.yml

  pull_request:
    paths:
      - '**.php'
      - phpunit.xml.dist
      - composer.json
      - .github/workflows/tests.yml

jobs:
  phpunit:
    runs-on: ubuntu-latest

    name: PHP 8.5 - Laravel 13

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          extensions: curl, pdo, sqlite, pdo_sqlite

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run test phpunit
        run: vendor/bin/phpunit --stop-on-error --stop-on-failure
